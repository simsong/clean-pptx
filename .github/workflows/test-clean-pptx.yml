name: Test clean_pptx

on:
  push:
  pull_request:

jobs:
  test-clean-pptx:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pytest python-pptx Pillow

      - name: Run test_clean_pptx.py
        run: pytest -q tests/test_clean_pptx.py
